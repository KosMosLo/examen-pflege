<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{--bg:#f6f7f9;--c:#fff;--t:#1d2430;--m:#5b6678;--a:#0f766e;--ab:#d9f2ee;--ok:#15803d;--no:#b91c1c;--l:#e2e6ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--c:#18202a;--t:#e8edf3;--m:#9aa6b8;--a:#4fd1c0;--ab:#17413d;--ok:#4ade80;--no:#f87171;--l:#2a3441}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:12px 14px 80px}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;gap:6px;padding:8px 14px;max-width:720px;margin:0 auto;z-index:5}
nav a,.chip{flex:1;text-align:center;padding:9px 6px;border-radius:10px;background:var(--c);border:1px solid var(--l);color:var(--t);text-decoration:none;font-size:14px;cursor:pointer}
nav a.on,.chip.on{background:var(--a);color:#fff;border-color:var(--a)}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:14px;margin:10px 0}
h1{font-size:21px;margin:8px 0}h2{font-size:19px;margin:4px 0 8px}h3{font-size:14px;margin:14px 0 4px;color:var(--m);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:6px;margin:8px 0}.item{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--t);text-decoration:none}
.tag{font-size:12px;background:var(--ab);color:var(--a);border-radius:8px;padding:2px 7px;margin-left:4px}
ul{padding-left:20px;margin:6px 0}li{margin:5px 0}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px;border-radius:10px;border:1px solid var(--l);background:var(--bg);color:var(--t);font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--ab)}.opt.no{border-color:var(--no)}.opt.sel{border-color:var(--a);background:var(--ab)}
.fb{margin-top:8px;font-size:15px}.btn{padding:10px 14px;border-radius:10px;border:0;background:var(--a);color:#fff;font:inherit;cursor:pointer}
a.btn{display:block;text-align:center;text-decoration:none;color:#fff;margin:8px 0}a.btn.g{color:var(--t)}
.btn.g{background:var(--c);color:var(--t);border:1px solid var(--l)}small,.m{color:var(--m);font-size:14px}
a{color:var(--a)}.bar{height:8px;background:var(--l);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}
</style></head><body>
<nav><a href="#themen" id="n1" style="padding:9px 2px;font-size:13px">Themen</a><a href="#faelle" id="n6" style="padding:9px 2px;font-size:13px">Fälle</a><a href="#quiz" id="n2" style="padding:9px 2px;font-size:13px">Quiz</a><a href="#muendlich" id="n5" style="padding:9px 2px;font-size:13px">Üben</a><a href="#plan" id="n4" style="padding:9px 2px;font-size:13px">Plan</a><a href="#info" id="n3" style="padding:9px 2px;font-size:13px">Quellen</a></nav>
<main id="app"></main>

<script src="deep.js"></script>
<script src="questions.js"></script>
<script src="questions2.js"></script>
<script src="oral.js"></script>
<script src="oral2.js"></script>
<script src="cases.js"></script>
<script src="faelle.js"></script>
<script src="app.js"></script>
</body></html>
