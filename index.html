<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Examen Pflege – Lern-App</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b7285" id="tc">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Examen Pflege">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<script>
/* Theme früh setzen, damit es nicht blinkt: "auto" (Systemeinstellung), "hell" oder "dunkel" */
(function(){var t="auto";try{t=localStorage.getItem("extheme")||"auto"}catch(e){}
if(t=="hell")document.documentElement.setAttribute("data-theme","light");else if(t=="dunkel")document.documentElement.setAttribute("data-theme","dark")})();
</script>
<style>
:root{--bg:#eef3f7;--c:#ffffff;--c2:#f5f9fc;--t:#14212e;--m:#566a7f;--a:#0b7285;--ac:#ffffff;--ab:#dff3f7;--ok:#15803d;--okb:#e6f6ec;--no:#c0392b;--nob:#fdecea;--l:#d5dfe8;--sh:0 1px 2px rgba(20,33,46,.06),0 4px 14px rgba(20,33,46,.05);--grid:rgba(11,114,133,.05);box-sizing:border-box}
:root[data-theme="dark"]{--bg:#0a121b;--c:#111c28;--c2:#0e1822;--t:#e6eef5;--m:#93a7bb;--a:#3ec6e0;--ac:#04222a;--ab:#12323d;--ok:#4ade80;--okb:#12301f;--no:#f87171;--nob:#35191b;--l:#22364a;--sh:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);--grid:rgba(62,198,224,.05)}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#0a121b;--c:#111c28;--c2:#0e1822;--t:#e6eef5;--m:#93a7bb;--a:#3ec6e0;--ac:#04222a;--ab:#12323d;--ok:#4ade80;--okb:#12301f;--no:#f87171;--nob:#35191b;--l:#22364a;--sh:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.25);--grid:rgba(62,198,224,.05)}}
*{box-sizing:border-box}html{scroll-padding-top:110px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;color:var(--t);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
header#top{display:flex;align-items:center;gap:12px;max-width:720px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 6px}
header#top .logo{width:42px;height:42px;border-radius:12px;background:var(--a);color:var(--ac);display:grid;place-items:center;font-weight:800;font-size:18px;letter-spacing:-.02em;box-shadow:var(--sh)}
header#top .ttl{flex:1;line-height:1.2}header#top .ttl b{display:block;font-size:17px;letter-spacing:.01em}header#top .ttl small{color:var(--m);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
header#top svg{flex:0 0 70px;height:26px;color:var(--a);opacity:.85}
#tm{border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:12px;height:38px;min-width:78px;padding:0 10px;font:600 12px/1 system-ui;cursor:pointer;box-shadow:var(--sh);letter-spacing:.04em}
main{max-width:720px;margin:0 auto;padding:6px 14px 90px}
nav{position:sticky;top:env(safe-area-inset-top,0px);display:flex;gap:4px;padding:8px 14px;max-width:720px;margin:0 auto;z-index:5;background:linear-gradient(var(--bg) 70%,transparent)}
nav a,.chip{flex:1;text-align:center;padding:9px 2px;border-radius:10px;background:var(--c);border:1px solid var(--l);color:var(--t);text-decoration:none;font-size:13px;font-weight:600;letter-spacing:.01em;cursor:pointer;box-shadow:var(--sh)}
nav a.on,.chip.on{background:var(--a);color:var(--ac);border-color:var(--a)}
.chip{font-size:14px;font-weight:500}
.card{background:var(--c);border:1px solid var(--l);border-left:3px solid var(--a);border-radius:12px;padding:14px;margin:10px 0;box-shadow:var(--sh)}
a.card.item{border-left-width:1px}a.card.item:active{background:var(--ab)}
h1{font-size:22px;margin:10px 0 6px;letter-spacing:-.01em}h1::after{content:"";display:block;width:44px;height:3px;border-radius:2px;background:var(--a);margin-top:6px}
h2{font-size:19px;margin:4px 0 8px}h3{font-size:12px;margin:16px 0 4px;color:var(--a);text-transform:uppercase;letter-spacing:.09em;font-weight:700}
.row{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}.item{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--t);text-decoration:none}
.tag{font-size:11px;font-weight:700;background:var(--ab);color:var(--a);border-radius:6px;padding:2px 7px;margin-left:4px;letter-spacing:.04em}
ul,ol{padding-left:20px;margin:6px 0}li{margin:5px 0}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:12px;border-radius:10px;border:1px solid var(--l);background:var(--c2);color:var(--t);font:inherit;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--a)}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.no{border-color:var(--no);background:var(--nob)}.opt.sel{border-color:var(--a);background:var(--ab)}
.fb{margin-top:8px;font-size:15px}
.btn{padding:11px 15px;border-radius:10px;border:0;background:var(--a);color:var(--ac);font:inherit;font-weight:600;cursor:pointer;box-shadow:var(--sh)}
.btn:active{filter:brightness(.92)}
a.btn{display:block;text-align:center;text-decoration:none;color:var(--ac);margin:8px 0}a.btn.g{color:var(--t)}
.btn.g{background:var(--c);color:var(--t);border:1px solid var(--l)}
.btn.g.on{background:var(--a);color:var(--ac);border-color:var(--a)}
small,.m{color:var(--m);font-size:14px}
a{color:var(--a)}
.bar{height:10px;background:var(--l);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),#2fd0a8);border-radius:6px}
textarea,select,input[type=date],input:not([type]),input[type=text],input[type=password]{color:var(--t)}
textarea:focus,select:focus,input:focus{outline:2px solid var(--a);outline-offset:1px}
details{border:1px solid var(--l);border-radius:10px;padding:8px 10px;background:var(--c2)}summary{cursor:pointer}
input[type=checkbox]{accent-color:var(--a);width:18px;height:18px;vertical-align:-3px;margin-right:4px}
@media (max-width:380px){nav a{font-size:12px}header#top svg{display:none}}
</style></head><body>
<header id="top"><div class="logo">EÐ</div><div class="ttl"><b>Examen Pflege</b><small>Lern-App</small></div><svg viewBox="0 0 70 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="0,14 14,14 18,14 22,4 28,22 33,10 37,14 70,14"/></svg><button id="tm" aria-label="Darstellung wechseln">Auto</button></header>
<nav><a href="#themen" id="n1">Themen</a><a href="#faelle" id="n6">Fälle</a><a href="#quiz" id="n2">Quiz</a><a href="#muendlich" id="n5">Üben</a><a href="#plan" id="n4">Plan</a><a href="#info" id="n3">Quellen</a></nav>
<main id="app"></main>
<script src="data.js"></script>
<script src="deep.js"></script>
<script src="questions.js"></script>
<script src="questions2.js"></script>
<script src="oral.js"></script>
<script src="oral2.js"></script>
<script src="cases.js"></script>
<script src="faelle.js"></script>
<script src="werkstatt.js"></script>
<script src="videos.js"></script>
<script src="app.js"></script>
<script>
/* Darstellung: Auto (Systemeinstellung), Hell, Dunkel */
(function(){var b=document.getElementById("tm"),tc=document.getElementById("tc"),order=["auto","dunkel","hell"],lab={auto:"Auto",dunkel:"Dunkel",hell:"Hell"};
function cur(){var t="auto";try{t=localStorage.getItem("extheme")||"auto"}catch(e){}return order.indexOf(t)<0?"auto":t}
function apply(t){var r=document.documentElement;if(t=="hell")r.setAttribute("data-theme","light");else if(t=="dunkel")r.setAttribute("data-theme","dark");else r.removeAttribute("data-theme");
b.textContent=(t=="dunkel"?"☾ ":t=="hell"?"☀ ":"◐ ")+lab[t];var dark=t=="dunkel"||(t=="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);tc.setAttribute("content",dark?"#0a121b":"#0b7285")}
b.onclick=function(){var n=order[(order.indexOf(cur())+1)%order.length];try{localStorage.setItem("extheme",n)}catch(e){}apply(n)};
apply(cur());if(window.matchMedia)try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",function(){if(cur()=="auto")apply("auto")})}catch(e){}})();
</script>
</body></html>
